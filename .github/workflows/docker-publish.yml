name: Build and Push Docker Image to GHCR

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR repository names must be lowercase, while github.repository_owner keeps
      # the account's original casing. README/docs document ghcr.io/aigniteluo/hermes-web-ui.
      - name: Resolve lowercase image repository
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "repository=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/hermes-web-ui" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:latest
            ${{ steps.image.outputs.repository }}:${{ github.sha }}
            ${{ steps.image.outputs.repository }}:${{ github.event.release.tag_name || github.ref_name }}

  keep-release-out-of-latest:
    name: Keep release out of GitHub latest
    if: always() && github.event_name == 'release'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as not latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest=false
